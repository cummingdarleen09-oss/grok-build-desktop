# Desktop app and provider tests on every branch push and pull request.
# Tag pushes (`v*`) and manual release builds live in release.yml. That
# workflow produces installers and the CLI binary on GitHub-hosted runners.

name: desktop

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            librsvg2-dev patchelf libssl-dev build-essential pkg-config \
            libayatana-appindicator3-dev file curl
      - name: Install protoc 29.3
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Provider and desktop-core tests
        run: cargo test -p grok-providers -p grok-desktop-core
      - name: Frontend
        working-directory: desktop
        run: npm ci && npm run build
      - name: Desktop binary
        run: cargo build -p grok-desktop

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install protoc 29.3
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Frontend
        working-directory: desktop
        run: npm ci && npm run build
      - name: Desktop binary
        run: cargo build -p grok-desktop

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install protoc 29.3
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the installed protoc
        shell: bash
        run: |
          set -euo pipefail
          proto_path="$(cygpath -m "$(command -v protoc)")"
          echo "PROTOC=${proto_path}" >> "$GITHUB_ENV"
          protoc --version
      - name: Frontend
        working-directory: desktop
        run: npm ci && npm run build
      - name: Desktop binary
        run: cargo build -p grok-desktop
