# Installers and CLI binaries.
#
# Pushing a tag v* (v0.1.0) builds with tauri-apps/tauri-action and uploads a
# GitHub Release. workflow_dispatch builds the same matrix and uploads Actions
# artifacts only. These jobs run on GitHub-hosted runners after this repo is
# on GitHub; they do not run on the development remote by themselves.
#
# Bundles are unsigned until the Apple / Windows secrets documented in the
# README are set. Non-empty secrets are forwarded into the build.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            librsvg2-dev patchelf libssl-dev build-essential pkg-config \
            libayatana-appindicator3-dev file curl libfuse2 cmake

      - name: Install protoc 29.3
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const path = "desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          ' "$VERSION"

      - name: Forward signing secrets when they are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          add() {
            if [ -n "${2:-}" ]; then
              {
                echo "$1<<EOF"
                printf '%s\n' "$2"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          }
          add APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          add APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          add APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          add APPLE_ID "$APPLE_ID"
          add APPLE_PASSWORD "$APPLE_PASSWORD"
          add APPLE_TEAM_ID "$APPLE_TEAM_ID"
          add APPLE_API_ISSUER "$APPLE_API_ISSUER"
          add APPLE_API_KEY "$APPLE_API_KEY"
          add APPLE_API_KEY_PATH "$APPLE_API_KEY_PATH"

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE is unset; the installer stays unsigned."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "grok-desktop.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $path

      - name: Point Tauri at the Windows certificate
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_THUMBPRINT:-}" ]; then
            echo "No Windows certificate imported; the installer stays unsigned."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const path = "desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.bundle.windows = config.bundle.windows || {};
            config.bundle.windows.certificateThumbprint = process.env.WINDOWS_CERT_THUMBPRINT;
            config.bundle.windows.digestAlgorithm = "sha256";
            config.bundle.windows.timestampUrl = "http://timestamp.digicert.com";
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci && npm install --no-save @tauri-apps/cli@2.10.1

      # bin/protoc is a dotslash wrapper with no Windows platform, so it is
      # not a Win32 binary. Point PROTOC at the protoc installed above.
      # Forward slashes stay intact in GITHUB_ENV; Rust accepts them.
      - name: Use the installed protoc on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          proto_path="$(cygpath -m "$(command -v protoc)")"
          echo "PROTOC=${proto_path}" >> "$GITHUB_ENV"
          echo "Using PROTOC=${proto_path}"
          protoc --version

      - name: Build the CLI (xai-grok-pager)
        env:
          CARGO_BUILD_JOBS: "2"
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p xai-grok-pager-bin --release --target "${{ matrix.target }}"
          ext=""
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            ext=".exe"
          fi
          mkdir -p dist
          src="target/${{ matrix.target }}/release/xai-grok-pager${ext}"
          dest="dist/grok-${{ matrix.target }}${ext}"
          cp "$src" "$dest"
          if [ -z "$ext" ]; then
            strip "$dest" || true
          fi

      - name: Bundle the desktop app
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Publish desktop bundles to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Grok Desktop ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseBody: |
            ## English

            Cursor-style desktop window, modeled on grok-app: sessions under repositories, kanban, project media, automations while the window is open, and Ctrl/Cmd+K search. The classic terminal page is gone. The standalone CLI binary still ships.

            Unlimited custom providers. Each one picks a display name, one API format (Anthropic Messages, OpenAI Chat Completions, or OpenAI Responses), a base URL, a keychain API key, and a model list. DeepSeek, Kimi, OpenAI, and Claude are optional templates. Official Grok stays built in, follows the newest model by default, and signs in inside the app (system browser, same OAuth flow as the CLI, shared `auth.json`). An OAuth session is preferred over an API key.

            Branch from a message with the icon in the hover bar. Stdio MCP servers are called during a turn. Mermaid fences render in the transcript.

            Unsigned builds, unless Apple or Windows signing secrets are configured on this repository.

            Desktop installers: Windows `.msi` and NSIS `.exe`, macOS `.dmg` for Apple Silicon and Intel, Linux `.deb` and `.AppImage`.
            CLI assets are named `grok-<target>` and are the `xai-grok-pager` binary. Put one on `PATH` as `grok` or `xai-grok-pager`, or set `GROK_BIN`.

            ## 中文

            桌面窗口改成 Cursor 式布局，并参考 grok-app：仓库下的会话、看板、项目媒体、窗口开着时触发的自动化，以及 Ctrl/Cmd+K 搜索。经典终端页面已去掉。独立的命令行二进制仍随发布包提供。

            自定义提供商不再有数量上限。每一项自选显示名称、一种接口格式（Anthropic Messages、OpenAI Chat Completions 或 OpenAI Responses）、接口地址、钥匙串密钥和模型列表。DeepSeek、Kimi、OpenAI、Claude 只是可选模板。官方 Grok 仍是内置项，默认跟随最新模型，并在应用内登录（系统浏览器，与命令行相同的 OAuth 流程，共用 `auth.json`）。有 OAuth 会话时优先于 API 密钥。

            悬停消息时用图标从该消息分支。对话回合会调用 stdio MCP。记录里的 Mermaid 图会渲染出来。

            若仓库未配置 Apple 或 Windows 签名密钥，安装包未签名。

            桌面安装包：Windows 的 `.msi` 和 NSIS `.exe`，Apple Silicon 与 Intel 的 macOS `.dmg`，Linux 的 `.deb` 和 `.AppImage`。
            名为 `grok-<target>` 的文件是 `xai-grok-pager` 命令行。放到 `PATH` 里并改名为 `grok` 或 `xai-grok-pager`，或设置 `GROK_BIN`。

      - name: Attach the CLI binary to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/grok-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grok-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/grok-*
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
