[package]
name = "grok-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Third-party model providers for the grok-build fork (OpenAI-compatible and Anthropic Messages)"
publish = false

[lib]
name = "grok_providers"
path = "src/lib.rs"

[[bin]]
name = "grok-providers"
path = "src/main.rs"

[features]
default = []
# OS keychain. Off by default so the CLI build does not need a secret-service
# toolchain; the desktop app turns it on.
keyring = ["dep:keyring"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
xai-grok-models = { workspace = true }
keyring = { version = "3", optional = true }

# keyring 3 has no default store. Without these features every platform gets
# the in-memory mock, which silently drops saved keys.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
